[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-rk3588-vlm-experiment"
version = "0.1.0"
description = "Reproducible RK3588 VLM experiment runner"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
image = ["Pillow>=10"]

[project.scripts]
rkvlm-exp = "codex_vlm.cli:main"

[tool.setuptools]
packages = ["codex_vlm"]
